<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার দোকান</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .hero {
            padding: 60px 20px;
            text-align: center;
            background: white;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .products {
            padding: 30px 20px;
            max-width: 1000px;
            margin: auto;
        }

        .product {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .product h2 {
            margin-top: 0;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
        }

        button {
            background: #111;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <header>
        <h2>আমার দোকান</h2>
    </header>

    <section class="hero">
        <h1>আমাদের অনলাইন শপে স্বাগতম</h1>
        <p>ভালো পণ্য, ভালো দাম</p>
    </section>

    <section class="products">

        <div class="product">
            <h2>Sample Product</h2>
            <p>এখানে আমাদের পণ্যের বিস্তারিত লেখা হবে।</p>
            <p class="price">৳500</p>
            <button>অর্ডার করুন</button>
        </div>

    </section>

</body>
</html>
