<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আমার দোকান</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f5f6f8;
    color:#222;
}

/* Header */
header{
    background:#111;
    color:white;
    padding:15px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.cart-btn{
    border:0;
    background:white;
    color:#111;
    padding:9px 14px;
    border-radius:22px;
    font-size:14px;
    cursor:pointer;
}

/* Hero */
.hero{
    background:white;
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:35px;
    margin:0 0 15px;
}

.hero p{
    color:#666;
    font-size:18px;
}

.shop-button{
    display:inline-block;
    margin-top:15px;
    background:#111;
    color:white;
    padding:13px 25px;
    border-radius:8px;
    text-decoration:none;
}

/* Section */
.section{
    max-width:1100px;
    margin:auto;
    padding:35px 18px;
}

.section-title{
    text-align:center;
    margin-bottom:20px;
}

/* Search */
.search{
    width:100%;
    max-width:500px;
    display:block;
    margin:0 auto 25px;
    padding:13px 16px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

/* Products */
.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.product{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.product-image{
    height:190px;
    background:#e9e9e9;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    font-size:16px;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-info{
    padding:16px;
}

.product h3{
    margin:0 0 8px;
    font-size:20px;
}

.product p{
    color:#666;
    font-size:14px;
    line-height:1.6;
}

.price{
    font-size:21px;
    font-weight:bold;
    margin:12px 0;
}

.order-button{
    width:100%;
    border:0;
    background:#111;
    color:white;
    padding:12px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

/* Cart */
.cart-box{
    position:fixed;
    right:-100%;
    top:0;
    width:90%;
    max-width:400px;
    height:100%;
    background:white;
    z-index:2000;
    box-shadow:-5px 0 20px rgba(0,0,0,.2);
    padding:20px;
    overflow-y:auto;
    transition:.3s;
}

.cart-box.active{
    right:0;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    padding-bottom:12px;
}

.close-btn{
    border:0;
    background:#eee;
    padding:7px 11px;
    border-radius:6px;
    cursor:pointer;
}
