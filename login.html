<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - Gaming Guru Shop</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button,
    .register-link {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      display: block;
      text-align: center;
      text-decoration: none;
    }

    #emailLogin {
      background: #111;
      color: white;
    }

    #googleLogin {
      background: #4285f4;
      color: white;
    }

    .register-link {
      background: #eee;
      color: #111;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .divider {
      text-align: center;
      margin: 20px 0;
      color: #777;
    }

  </style>
</head>

<body>

  <div class="login-box">

    <h2>Login</h2>

    <input
      type="email"
      id="email"
      placeholder="আপনার Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button id="emailLogin">
      Login
    </button>

    <div class="divider">
      অথবা
    </div>

    <button id="googleLogin">
      Sign in with Google
    </button>

    <a
      class="register-link"
      href="register.html"
    >
      Create New Account / Register
    </a>

    <div id="message"></div>

  </div>


  <script type="module">

    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword
    }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyDHQ-d4S5LU5c7yvHPgQ0YgxZLcYa0evKI",

      authDomain:
        "guru-stor-database.firebaseapp.com",

      projectId:
        "guru-stor-database",

      storageBucket:
        "guru-stor-database.firebasestorage.app",

      messagingSenderId:
        "735673899170",

      appId:
        "1:735673899170:web:abc4c60a8a7fef5b5fdffb",

      measurementId:
        "G-C78SBC0X7C"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    const message =
      document.getElementById("message");


    function showMessage(text) {
      message.textContent = text;
    }


    document
      .getElementById("emailLogin")
      .addEventListener("click", async () => {

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          showMessage(
            "Email এবং Password দিন।"
          );

          return;
        }


        try {

          showMessage("Login হচ্ছে...");


          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          showMessage(
            "Congratulations! Login successful."
          );


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 1000);


        } catch (error) {

          console.error(error);

          showMessage(
            "Login failed: " +
            error.message
          );

        }

      });


    const googleProvider =
      new GoogleAuthProvider();


    document
      .getElementById("googleLogin")
      .addEventListener("click", async () => {

        try {

          showMessage(
            "Google Login হচ্ছে..."
          );


          await signInWithPopup(
            auth,
            googleProvider
          );


          showMessage(
            "Congratulations! Google Login successful."
          );


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 1000);


        } catch (error) {

          console.error(error);

          showMessage(
            "Google Login failed: " +
            error.message
          );

        }

      });

  </script>

</body>

</html>
